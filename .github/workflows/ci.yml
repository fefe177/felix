name: CI

# Lints, type-checks and tests the Python backend and the GUI on every push and
# pull request (Linux runners). Browser tests skip when Chromium is absent and
# OCR tests skip when the engine/font is unavailable - both are expected in CI.

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (with dev tools)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest -q

  gui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: gui
        run: npm install

      - name: Build (type-check + bundle)
        working-directory: gui
        run: npm run build

      - name: Test (vitest)
        working-directory: gui
        run: npm test
