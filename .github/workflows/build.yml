name: Build BigMC

# Baut das Plugin bei jedem Push und stellt die fertige BigMC.jar bereit:
#  - als Artefakt (im jeweiligen Lauf, .zip)
#  - zusaetzlich als "latest"-Release zum direkten 1-Klick-Download (kein Entpacken)
# Laeuft auch manuell ueber "Run workflow".
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Mit Maven bauen
        run: mvn -B clean package

      - name: BigMC.jar als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: BigMC
          path: target/BigMC.jar
          if-no-files-found: error

      # Auf dem Entwicklungs-Branch zusaetzlich ein "latest"-Release pflegen,
      # damit die fertige BigMC.jar mit einem Klick (ohne ZIP) ladbar ist:
      # Repo -> Releases -> "BigMC - neuester Build" -> BigMC.jar.
      - name: Release "latest" aktualisieren
        if: github.ref == 'refs/heads/claude/bigmc-minecraft-plugin-srqtf3'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BigMC - neuester Build
          body: Automatisch gebaute BigMC.jar des neuesten Commits. Einfach herunterladen und in den plugins-Ordner legen.
          files: target/BigMC.jar
