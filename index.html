<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Turm-Verteidigung</title>
<style>
  :root {
    --bg: #1a2332;
    --panel: #232f45;
    --panel-light: #2d3b55;
    --accent: #f5b942;
    --text: #e8edf5;
    --text-dim: #9aa8c0;
    --green: #5fd068;
    --red: #e85d5d;
    --blue: #5da9e8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    height: 100%;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100%;
    padding: 8px;
    gap: 8px;
  }
  #topbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 800px;
    background: var(--panel);
    border-radius: 10px;
    padding: 8px 14px;
  }
  .stats { display: flex; gap: 18px; font-size: 17px; font-weight: 600; }
  .stat span { color: var(--accent); }
  #stat-lives span { color: var(--red); }
  #stat-wave span { color: var(--blue); }
  .controls { display: flex; gap: 6px; }
  button {
    background: var(--panel-light);
    color: var(--text);
    border: 1px solid #3d4d6e;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, transform .05s;
  }
  button:hover { background: #3a4a68; }
  button:active { transform: scale(.96); }
  button.primary { background: var(--accent); color: #1a2332; border-color: var(--accent); }
  button.primary:hover { background: #ffd06a; }
  button:disabled { opacity: .45; cursor: default; }
  #game-wrap { position: relative; width: 100%; max-width: 800px; }
  canvas {
    display: block;
    width: 100%;
    background: #24402a;
    border-radius: 10px;
    cursor: crosshair;
  }
  #shop {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    width: 100%;
    max-width: 800px;
    background: var(--panel);
    border-radius: 10px;
    padding: 10px;
  }
  .shop-btn {
    flex: 1 1 150px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    padding: 8px 12px;
    text-align: left;
    line-height: 1.3;
  }
  .shop-btn small { color: var(--text-dim); font-weight: 400; font-size: 12px; }
  .shop-btn .cost { color: var(--accent); }
  .shop-btn.selected { outline: 2px solid var(--accent); background: #3a4a68; }
  .shop-btn.unaffordable .cost { color: var(--red); }
  #tower-panel {
    position: absolute;
    display: none;
    flex-direction: column;
    gap: 6px;
    background: var(--panel);
    border: 1px solid #3d4d6e;
    border-radius: 10px;
    padding: 10px;
    min-width: 170px;
    z-index: 5;
    box-shadow: 0 6px 18px rgba(0,0,0,.45);
  }
  #tower-panel h3 { font-size: 15px; }
  #tower-panel .row { font-size: 13px; color: var(--text-dim); }
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(10, 15, 25, .82);
    border-radius: 10px;
    z-index: 10;
    text-align: center;
    padding: 20px;
  }
  #overlay h2 { font-size: 34px; }
  #overlay p { color: var(--text-dim); font-size: 16px; }
  #overlay .btn-row { display: flex; gap: 10px; }
  #hint {
    width: 100%;
    max-width: 800px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="stats">
      <div class="stat" id="stat-gold">💰 <span>0</span></div>
      <div class="stat" id="stat-lives">❤️ <span>0</span></div>
      <div class="stat" id="stat-wave">🌊 <span>0/20</span></div>
    </div>
    <div class="controls">
      <button id="btn-wave" class="primary">Welle starten</button>
      <button id="btn-pause" title="Pause (Leertaste)">⏸</button>
      <button id="btn-speed" title="Spielgeschwindigkeit">1×</button>
      <button id="btn-sound" title="Ton an/aus">🔊</button>
    </div>
  </div>

  <div id="game-wrap">
    <canvas id="game" width="800" height="560"></canvas>
    <div id="tower-panel">
      <h3 id="tp-name">Turm</h3>
      <div class="row" id="tp-stats"></div>
      <button id="tp-upgrade" class="primary">Aufwerten</button>
      <button id="tp-sell">Verkaufen</button>
    </div>
    <div id="overlay">
      <h2 id="ov-title">Game Over</h2>
      <p id="ov-text"></p>
      <div class="btn-row">
        <button id="ov-restart" class="primary">Neustart</button>
        <button id="ov-endless" style="display:none">Endlos weiterspielen</button>
      </div>
    </div>
  </div>

  <div id="shop"></div>
  <div id="hint">Turm wählen &amp; auf freies Feld klicken · Turm anklicken zum Aufwerten/Verkaufen · Tasten 1–4 = Türme, Esc = Abbrechen, Leertaste = Pause</div>
</div>
<script src="game.js"></script>
</body>
</html>
