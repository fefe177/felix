[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localpilot"
version = "0.0.0"
description = "LocalPilot - an autonomous local desktop agent (Phase 0 scaffold)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LocalPilot" }]
keywords = ["agent", "automation", "desktop", "local-llm"]

dependencies = [
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "pyyaml>=6.0,<7",
    "structlog>=24.1,<25",
    "openai>=1.30,<2",
    "httpx>=0.27,<1",
    "aiosqlite>=0.20,<1",
    "playwright>=1.44,<2",
    "pyautogui>=0.9.54,<1",
    "pygetwindow>=0.0.9,<1",
    "mss>=9.0,<10",
    "pillow>=10.3,<12",
    "rapidocr-onnxruntime>=1.3,<2",
    "numpy>=1.26,<3",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "websockets>=12.0,<14",
    "python-dotenv>=1.0,<2",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
localpilot = "localpilot.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["localpilot"]
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
