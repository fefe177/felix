# ============================================================
#  BigMC - config.yml
#  Alle Zahlen/Einstellungen des Plugins stehen hier zentral.
#  (In spaeteren Phasen kommen weitere Abschnitte dazu.)
# ============================================================

# Datenbank-Einstellungen
database:
  # Dateiname der SQLite-Datenbank (liegt im Plugin-Ordner)
  file: "bigmc.db"

# Wirtschafts-Einstellungen
economy:
  # Startguthaben fuer neue Spieler
  start-balance: 100.0
  # Anzeigename und Symbol der Waehrung
  currency-name: "Coins"
  currency-symbol: "$"
  # Kleinster Betrag, der per /pay ueberwiesen werden darf
  pay-min-amount: 0.01
  # Anzahl der Eintraege in /baltop
  baltop-size: 10

# Auktionshaus-Einstellungen
auction:
  # Wie lange ein Angebot aktiv bleibt (in Stunden)
  duration-hours: 48
  # Maximale Anzahl gleichzeitig aktiver Auktionen pro Spieler
  max-listings: 7
  # Erlaubte Preisspanne pro Angebot
  min-price: 1.0
  max-price: 10000000.0
  # Wie oft auf abgelaufene Auktionen geprueft wird (in Sekunden)
  expiry-check-seconds: 60

# ------------------------------------------------------------
# Adminshop: feste Kauf- und Verkaufspreise.
#   buy  = Kaufpreis pro Stueck (0 = nicht kaufbar)
#   sell = Verkaufspreis pro Stueck (0 = nicht verkaufbar)
# Die sell-Preise gelten auch fuer /sell hand und /sell all.
# Material-Namen: https://jd.papermc.io/paper/1.21/org/bukkit/Material.html
# ------------------------------------------------------------
