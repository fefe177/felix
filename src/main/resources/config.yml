# ============================================================
#  BigMC - config.yml
#  Alle Zahlen/Einstellungen des Plugins stehen hier zentral.
#  (In spaeteren Phasen kommen weitere Abschnitte dazu.)
# ============================================================

# Datenbank-Einstellungen
database:
  # Dateiname der SQLite-Datenbank (liegt im Plugin-Ordner)
  file: "bigmc.db"

# Wirtschafts-Einstellungen
economy:
  # Startguthaben fuer neue Spieler
  start-balance: 100.0
  # Anzeigename und Symbol der Waehrung
  currency-name: "Coins"
  currency-symbol: "$"
  # Kleinster Betrag, der per /pay ueberwiesen werden darf
  pay-min-amount: 0.01
  # Anzahl der Eintraege in /baltop
  baltop-size: 10

# Auktionshaus-Einstellungen
auction:
  # Wie lange ein Angebot aktiv bleibt (in Stunden)
  duration-hours: 48
  # Maximale Anzahl gleichzeitig aktiver Auktionen pro Spieler
  max-listings: 7
  # Erlaubte Preisspanne pro Angebot
  min-price: 1.0
  max-price: 10000000.0
  # Wie oft auf abgelaufene Auktionen geprueft wird (in Sekunden)
  expiry-check-seconds: 60

# Auftragssystem-Einstellungen
order:
  # Maximale Anzahl gleichzeitig offener Auftraege pro Spieler
  max-orders: 5
  # Kleinster erlaubter Stueckpreis
  min-price-per-item: 0.01
  # Maximale Bestellmenge pro Auftrag
  max-amount: 10000

# Statistik-Einstellungen
stats:
  # Anzahl der Eintraege in /top
  top-size: 10

# ------------------------------------------------------------
# Custom-Spawner: produzieren Items (KEINE Mobs) in einen internen Speicher.
# Per Rechtsklick oeffnet sich ein GUI zum Abholen. Spawner sind stapelbar
# (bis max-stack) - mehr Stapel = mehr Produktion und mehr Speicher.
#   product               -> produziertes Item
#   amount-per-cycle      -> Menge pro Zyklus (je Stack-Einheit)
#   interval-seconds      -> Abstand zwischen zwei Zyklen
#   max-storage-per-stack -> Speicher je Stack-Einheit (Gesamt = * Stapelgroesse)
#   price                 -> Kaufpreis pro Spawner
#   display-entity        -> optische Figur im Spawner (optional)
# ------------------------------------------------------------
spawners:
  # Wie oft (in Sekunden) die Produktion berechnet wird
  production-check-seconds: 10
  # Maximale Anzahl Spawner, die man zusammenstapeln kann
  max-stack: 500
  types:
    knochen:
      display-name: "&fKnochen-Spawner"
      product: BONE
      amount-per-cycle: 1
      interval-seconds: 60
      max-storage-per-stack: 2000
      price: 10000.0
      display-entity: SKELETON
    faden:
      display-name: "&7Faden-Spawner"
      product: STRING
      amount-per-cycle: 1
      interval-seconds: 60
      max-storage-per-stack: 2000
      price: 10000.0
      display-entity: SPIDER
    schiesspulver:
      display-name: "&aSchießpulver-Spawner"
      product: GUNPOWDER
      amount-per-cycle: 1
      interval-seconds: 90
      max-storage-per-stack: 1500
      price: 20000.0
      display-entity: CREEPER
    fleisch:
      display-name: "&2Fleisch-Spawner"
      product: ROTTEN_FLESH
      amount-per-cycle: 1
      interval-seconds: 45
      max-storage-per-stack: 2500
      price: 8000.0
      display-entity: ZOMBIE
    enderperle:
      display-name: "&5Enderperlen-Spawner"
      product: ENDER_PEARL
      amount-per-cycle: 1
      interval-seconds: 180
      max-storage-per-stack: 1000
      price: 50000.0
      display-entity: ENDERMAN

# Sidebar-Scoreboard (Design/Zeilen stehen in der messages.yml)
scoreboard:
  # Sidebar fuer neue Spieler automatisch anzeigen?
  enabled-by-default: true
  # Aktualisierung in Sekunden
  update-seconds: 2

# Drill-Spitzhacke: baut einen 3x3-Bereich ab (Ebene je nach Blickrichtung).
drill:
  # Material der Spitzhacke
  material: DIAMOND_PICKAXE
  # Kaufpreis per /drill
  price: 50000.0
  # Zusaetzlicher Verschleiss je mit-gebrochenem Block (0 = kein Extra-Verschleiss)
  durability-per-block: 1

# Event-Einstellungen: Belohnung fuer alle Teilnehmer beim /event stop.
event:
  reward:
    money: 2500.0
    items:
      DIAMOND: 3
      GOLDEN_APPLE: 2

# Vote-Belohnungen (ueber NuVotifier). %player% wird in Befehlen ersetzt.
vote:
  # Sieg/Vote im Chat fuer alle ankuendigen?
  broadcast: true
  # Geld pro Vote
  money: 500.0
  # Item-Belohnungen pro Vote (Material: Anzahl)
  items:
    DIAMOND: 1
    EXPERIENCE_BOTTLE: 8
  # Konsolen-Befehle pro Vote (z.B. Crate-Key). Leer lassen, wenn nicht gewuenscht.
  commands: []
  # Vote-Links, die /vote anzeigt
  links:
    - "&7Vote für uns und erhalte Belohnungen:"
    - "&b» &fhttps://example.com/vote1"
    - "&b» &fhttps://example.com/vote2"

# Flug-Einstellungen (kostenpflichtiges, befristetes Fliegen)
fly:
  # Preis pro Kauf
  price: 1000.0
  # Flugdauer pro Kauf (in Sekunden)
  duration-seconds: 300
  # Wie viele Sekunden vor Ablauf gewarnt wird
  warn-seconds: 10
  # Sturzschutz nach Flug-Ende (in Server-Ticks, 20 Ticks = 1 Sekunde)
  fall-protection-ticks: 100

# ------------------------------------------------------------
# Rangsystem (Leiter): Spieler steigen mit /rank buy auf.
# Reihenfolge in dieser Datei = Reihenfolge der Leiter (oben = niedrigster).
#   name                     -> Anzeigename (mit Farbcodes)
#   prefix                   -> Chat-Prefix
#   cost                     -> Preis fuer DIESEN Rang (erster Rang meist 0)
#   required-playtime-hours  -> benoetigte Spielzeit (optional)
#   required-kills           -> benoetigte Kills (optional)
#   permissions              -> kumulativ (hoehere Raenge erben niedrigere)
# ------------------------------------------------------------
ranks:
  # Aufstieg fuer alle im Chat ankuendigen?
  broadcast-rankup: true
  list:
    spieler:
      name: "&7Spieler"
      prefix: "&7[Spieler] "
      cost: 0
      required-playtime-hours: 0
      required-kills: 0
      permissions: []
    bronze:
      name: "&6Bronze"
      prefix: "&6[Bronze] "
      cost: 5000
      required-playtime-hours: 2
      required-kills: 0
      permissions:
        - "bigmc.perk.bronze"
    silber:
      name: "&7&lSilber"
      prefix: "&7&l[Silber] "
      cost: 25000
      required-playtime-hours: 10
      required-kills: 25
      permissions:
        - "bigmc.perk.silber"
    gold:
      name: "&e&lGold"
      prefix: "&e&l[Gold] "
      cost: 100000
      required-playtime-hours: 30
      required-kills: 100
      permissions:
        - "bigmc.perk.gold"
    diamant:
      name: "&b&lDiamant"
      prefix: "&b&l[Diamant] "
      cost: 500000
      required-playtime-hours: 75
      required-kills: 300
      permissions:
        - "bigmc.perk.diamant"

# Duell-Einstellungen
duel:
  # Sekunden, die eine Herausforderung gueltig bleibt
  challenge-timeout-seconds: 30
  # Countdown vor Duell-Start (Spieler sind solange eingefroren)
  countdown-seconds: 5
  # Sieger im Chat fuer alle bekanntgeben?
  broadcast-winner: true
  # Arena-Spawnpunkte - bequem per "/duel setspawn 1" und "/duel setspawn 2" setzen.
  # (Hier nur als Platzhalter; world leer = Arena nicht gesetzt.)
  arena:
    spawn1:
      world: ""
      x: 0.0
      y: 100.0
      z: 0.0
      yaw: 0.0
      pitch: 0.0
    spawn2:
      world: ""
      x: 10.0
      y: 100.0
      z: 0.0
      yaw: 0.0
      pitch: 0.0
  # Start-Kit fuer beide Spieler (gleich = fair). enabled: false -> ohne Kit.
  kit:
    enabled: true
    armor:
      helmet: IRON_HELMET
      chestplate: IRON_CHESTPLATE
      leggings: IRON_LEGGINGS
      boots: IRON_BOOTS
    items:
      DIAMOND_SWORD: 1
      BOW: 1
      ARROW: 16
      GOLDEN_APPLE: 4
      COOKED_BEEF: 16

# ------------------------------------------------------------
