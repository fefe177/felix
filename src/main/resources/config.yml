# ============================================================
#  BigMC - config.yml
#  Alle Zahlen/Einstellungen des Plugins stehen hier zentral.
#  (In spaeteren Phasen kommen weitere Abschnitte dazu.)
# ============================================================

# Datenbank-Einstellungen
database:
  # Dateiname der SQLite-Datenbank (liegt im Plugin-Ordner)
  file: "bigmc.db"

# Wirtschafts-Einstellungen
economy:
  # Startguthaben fuer neue Spieler
  start-balance: 100.0
  # Anzeigename und Symbol der Waehrung
  currency-name: "Coins"
  currency-symbol: "$"
  # Kleinster Betrag, der per /pay ueberwiesen werden darf
  pay-min-amount: 0.01
  # Anzahl der Eintraege in /baltop
  baltop-size: 10

# Auktionshaus-Einstellungen
auction:
  # Wie lange ein Angebot aktiv bleibt (in Stunden)
  duration-hours: 48
  # Maximale Anzahl gleichzeitig aktiver Auktionen pro Spieler
  max-listings: 7
  # Erlaubte Preisspanne pro Angebot
  min-price: 1.0
  max-price: 10000000.0
  # Wie oft auf abgelaufene Auktionen geprueft wird (in Sekunden)
  expiry-check-seconds: 60

# Auftragssystem-Einstellungen
order:
  # Maximale Anzahl gleichzeitig offener Auftraege pro Spieler
  max-orders: 5
  # Kleinster erlaubter Stueckpreis
  min-price-per-item: 0.01
  # Maximale Bestellmenge pro Auftrag
  max-amount: 10000

# Statistik-Einstellungen
stats:
  # Anzahl der Eintraege in /top
  top-size: 10

# ------------------------------------------------------------
# Rangsystem (Leiter): Spieler steigen mit /rank buy auf.
# Reihenfolge in dieser Datei = Reihenfolge der Leiter (oben = niedrigster).
#   name                     -> Anzeigename (mit Farbcodes)
#   prefix                   -> Chat-Prefix
#   cost                     -> Preis fuer DIESEN Rang (erster Rang meist 0)
#   required-playtime-hours  -> benoetigte Spielzeit (optional)
#   required-kills           -> benoetigte Kills (optional)
#   permissions              -> kumulativ (hoehere Raenge erben niedrigere)
# ------------------------------------------------------------
ranks:
  # Aufstieg fuer alle im Chat ankuendigen?
  broadcast-rankup: true
  list:
    spieler:
      name: "&7Spieler"
      prefix: "&7[Spieler] "
      cost: 0
      required-playtime-hours: 0
      required-kills: 0
      permissions: []
    bronze:
      name: "&6Bronze"
      prefix: "&6[Bronze] "
      cost: 5000
      required-playtime-hours: 2
      required-kills: 0
      permissions:
        - "bigmc.perk.bronze"
    silber:
      name: "&7&lSilber"
      prefix: "&7&l[Silber] "
      cost: 25000
      required-playtime-hours: 10
      required-kills: 25
      permissions:
        - "bigmc.perk.silber"
    gold:
      name: "&e&lGold"
      prefix: "&e&l[Gold] "
      cost: 100000
      required-playtime-hours: 30
      required-kills: 100
      permissions:
        - "bigmc.perk.gold"
    diamant:
      name: "&b&lDiamant"
      prefix: "&b&l[Diamant] "
      cost: 500000
      required-playtime-hours: 75
      required-kills: 300
      permissions:
        - "bigmc.perk.diamant"

# Duell-Einstellungen
duel:
  # Sekunden, die eine Herausforderung gueltig bleibt
  challenge-timeout-seconds: 30
  # Countdown vor Duell-Start (Spieler sind solange eingefroren)
  countdown-seconds: 5
  # Sieger im Chat fuer alle bekanntgeben?
  broadcast-winner: true
  # Arena-Spawnpunkte - bequem per "/duel setspawn 1" und "/duel setspawn 2" setzen.
  # (Hier nur als Platzhalter; world leer = Arena nicht gesetzt.)
  arena:
    spawn1:
      world: ""
      x: 0.0
      y: 100.0
      z: 0.0
      yaw: 0.0
      pitch: 0.0
    spawn2:
      world: ""
      x: 10.0
      y: 100.0
      z: 0.0
      yaw: 0.0
      pitch: 0.0
  # Start-Kit fuer beide Spieler (gleich = fair). enabled: false -> ohne Kit.
  kit:
    enabled: true
    armor:
      helmet: IRON_HELMET
      chestplate: IRON_CHESTPLATE
      leggings: IRON_LEGGINGS
      boots: IRON_BOOTS
    items:
      DIAMOND_SWORD: 1
      BOW: 1
      ARROW: 16
      GOLDEN_APPLE: 4
      COOKED_BEEF: 16

