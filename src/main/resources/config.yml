# ============================================================
#  BigMC - config.yml
#  Alle Zahlen/Einstellungen des Plugins stehen hier zentral.
#  (In spaeteren Phasen kommen weitere Abschnitte dazu.)
# ============================================================

# Datenbank-Einstellungen
database:
  # Dateiname der SQLite-Datenbank (liegt im Plugin-Ordner)
  file: "bigmc.db"

# Wirtschafts-Einstellungen
economy:
  # Startguthaben fuer neue Spieler
  start-balance: 100.0
  # Anzeigename und Symbol der Waehrung
  currency-name: "Coins"
  currency-symbol: "$"
  # Kleinster Betrag, der per /pay ueberwiesen werden darf
  pay-min-amount: 0.01
  # Anzahl der Eintraege in /baltop
  baltop-size: 10

# Auktionshaus-Einstellungen
auction:
  # Wie lange ein Angebot aktiv bleibt (in Stunden)
  duration-hours: 48
  # Maximale Anzahl gleichzeitig aktiver Auktionen pro Spieler
  max-listings: 7
  # Erlaubte Preisspanne pro Angebot
  min-price: 1.0
  max-price: 10000000.0
  # Wie oft auf abgelaufene Auktionen geprueft wird (in Sekunden)
  expiry-check-seconds: 60

# Auftragssystem-Einstellungen
order:
  # Maximale Anzahl gleichzeitig offener Auftraege pro Spieler
  max-orders: 5
  # Kleinster erlaubter Stueckpreis
  min-price-per-item: 0.01
  # Maximale Bestellmenge pro Auftrag
  max-amount: 10000

# Statistik-Einstellungen
stats:
  # Anzahl der Eintraege in /top
  top-size: 10

# ------------------------------------------------------------
# Custom-Spawner: produzieren Items (KEINE Mobs) in einen internen Speicher.
# Per Rechtsklick oeffnet sich ein GUI zum Abholen. Spawner sind stapelbar
# (bis max-stack) - mehr Stapel = mehr Produktion und mehr Speicher.
#   product               -> produziertes Item
#   amount-per-cycle      -> Menge pro Zyklus (je Stack-Einheit)
#   interval-seconds      -> Abstand zwischen zwei Zyklen
#   max-storage-per-stack -> Speicher je Stack-Einheit (Gesamt = * Stapelgroesse)
#   price                 -> Kaufpreis pro Spawner
#   display-entity        -> optische Figur im Spawner (optional)
# ------------------------------------------------------------
spawners:
  # Wie oft (in Sekunden) die Produktion berechnet wird
  production-check-seconds: 10
  # Maximale Anzahl Spawner, die man zusammenstapeln kann
  max-stack: 500
  # shard-price > 0 -> Spawner kostet Shards (DonutSMP-Stil).
  # shard-price: 0  -> Spawner kostet stattdessen "price" (Geld).
  types:
    knochen:
      display-name: "&fKnochen-Spawner"
      product: BONE
      amount-per-cycle: 1
      interval-seconds: 60
      max-storage-per-stack: 2000
      price: 10000.0
      shard-price: 50
      display-entity: SKELETON
    faden:
      display-name: "&7Faden-Spawner"
      product: STRING
      amount-per-cycle: 1
      interval-seconds: 60
      max-storage-per-stack: 2000
      price: 10000.0
      shard-price: 50
      display-entity: SPIDER
    schiesspulver:
      display-name: "&aSchießpulver-Spawner"
      product: GUNPOWDER
      amount-per-cycle: 1
      interval-seconds: 90
      max-storage-per-stack: 1500
      price: 20000.0
      shard-price: 100
      display-entity: CREEPER
    fleisch:
      display-name: "&2Fleisch-Spawner"
      product: ROTTEN_FLESH
      amount-per-cycle: 1
      interval-seconds: 45
      max-storage-per-stack: 2500
      price: 8000.0
      shard-price: 40
      display-entity: ZOMBIE
    enderperle:
      display-name: "&5Enderperlen-Spawner"
      product: ENDER_PEARL
      amount-per-cycle: 1
      interval-seconds: 180
      max-storage-per-stack: 1000
      price: 50000.0
      shard-price: 250
      display-entity: ENDERMAN

# Shards: zweite Waehrung (wie auf DonutSMP).
# Verdienen: PvP-Kills + AFK-Zone. Ausgeben: Spawner (shard-price pro Typ).
shards:
  # Symbol hinter dem Betrag
  symbol: "❖"
  # Shards pro PvP-Kill (0 = aus)
  per-kill: 5

# AFK-Zone: /afk teleportiert hin, dort gibt es regelmaessig Shards.
# Position bequem per "/afk set" setzen (Admin).
afk:
  # Abstand zwischen zwei Belohnungen (Sekunden)
  reward-interval-seconds: 60
  # Shards pro Belohnung
  shards-per-interval: 1
  zone:
    world: ""
    x: 0.0
    y: 100.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0

# Daily-Login-Rewards: Belohnung je Tag im Zyklus (Serie/Streak).
dailylogin:
  cycle: 7
  rewards:
    1: {money: 500.0, shards: 2}
    2: {money: 750.0, shards: 3}
    3: {money: 1000.0, shards: 4}
    4: {money: 1500.0, shards: 6}
    5: {money: 2000.0, shards: 8}
    6: {money: 3000.0, shards: 12}
    7: {money: 5000.0, shards: 25, items: {DIAMOND: 8}}

# ------------------------------------------------------------
# Cosmetics: Partikel-Trails, Chat-Titel, Join-Nachrichten.
#   value bei particles = Partikel-Name; bei titles = Chat-Tag;
#   bei join-messages = Vorlage (%player%).
# ------------------------------------------------------------
cosmetics:
  particle-update-ticks: 5
  particles:
    hearts:
      display: "&dHerzen"
      icon: POPPY
      value: HEART
    flames:
      display: "&cFlammen"
      icon: BLAZE_POWDER
      value: FLAME
    clouds:
      display: "&fWolken"
      icon: WHITE_WOOL
      value: CLOUD
    notes:
      display: "&aNoten"
      icon: NOTE_BLOCK
      value: NOTE
    souls:
      display: "&bSeelen"
      icon: SOUL_SAND
      value: SOUL_FIRE_FLAME
  titles:
    veteran:
      display: "&7[Veteran]"
      icon: IRON_INGOT
      value: "&7[Veteran] "
    legend:
      display: "&6[Legende]"
      icon: GOLD_INGOT
      value: "&6[Legende] "
    king:
      display: "&5[König]"
      icon: GOLDEN_HELMET
      value: "&5[König] "
  join-messages:
    epic:
      display: "&bEpischer Auftritt"
      icon: FIREWORK_ROCKET
      value: "&b✦ &e%player% &7ist dem Server beigetreten! &b✦"
    simple:
      display: "&aSchlicht"
      icon: PAPER
      value: "&8[&a+&8] &7%player%"

# Prestige: kostet Geld, gibt dauerhaften Verkaufs-Bonus + Shards.
prestige:
  max-prestige: 10
  base-cost: 100000.0
  cost-multiplier: 2.0
  sell-bonus-percent: 5.0
  reward-shards: 50
  broadcast: true

# ------------------------------------------------------------
# Boss-Events: automatische Boss-Spawns mit Schadens-Rangliste.
#   entity = LivingEntity-Typ; location leer = nahe eines zufaelligen Spielers.
#   rewards: Platz -> {money, shards, items}.
# ------------------------------------------------------------
bossevents:
  auto-spawn: true
  interval-minutes: 60
  fight-timeout-seconds: 300
  bosses:
    ravager_koenig:
      display: "&c&lRavager-König"
      entity: RAVAGER
      health: 500
      location:
        world: ""
        x: 0.0
        y: 80.0
        z: 0.0
      rewards:
        1: {money: 50000.0, shards: 100, items: {DIAMOND_BLOCK: 4}}
        2: {money: 25000.0, shards: 50}
        3: {money: 10000.0, shards: 25}
    wither_lord:
      display: "&8&lWither-Lord"
      entity: WITHER
      health: 800
      location:
        world: ""
        x: 0.0
        y: 80.0
        z: 0.0
      rewards:
        1: {money: 100000.0, shards: 200, items: {NETHERITE_INGOT: 2}}
        2: {money: 50000.0, shards: 100}
        3: {money: 20000.0, shards: 50}

# ------------------------------------------------------------
# Crates: Schluessel -> gewichtete Belohnungen.
#   weight = relatives Gewicht (Drop-Chance); rarity nur fuer Anzeige.
#   money/shards/items/commands sind optional pro Belohnung.
# ------------------------------------------------------------
crates:
  vote:
    display: "&aVote-Crate"
    icon: CHEST
    rewards:
      - weight: 50
        rarity: COMMON
        display: "&7500 Geld"
        money: 500.0
      - weight: 25
        rarity: RARE
        display: "&b10 Shards"
        shards: 10
      - weight: 15
        rarity: EPIC
        display: "&516x Diamant"
        items:
          DIAMOND: 16
      - weight: 8
        rarity: EPIC
        display: "&53x Goldener Apfel"
        items:
          GOLDEN_APPLE: 3
      - weight: 2
        rarity: LEGENDARY
        display: "&6Netherite-Barren"
        items:
          NETHERITE_INGOT: 1
  legendary:
    display: "&6&lLegendäre Crate"
    icon: ENDER_CHEST
    rewards:
      - weight: 40
        rarity: RARE
        display: "&b25 Shards"
        shards: 25
      - weight: 30
        rarity: EPIC
        display: "&55000 Geld"
        money: 5000.0
      - weight: 20
        rarity: EPIC
        display: "&5Totem der Unsterblichkeit"
        items:
          TOTEM_OF_UNDYING: 1
      - weight: 8
        rarity: LEGENDARY
        display: "&6Verzauberter Goldapfel x2"
        items:
          ENCHANTED_GOLDEN_APPLE: 2
      - weight: 2
        rarity: LEGENDARY
        display: "&6Elytra"
        items:
          ELYTRA: 1

# Clan-System
clans:
  min-name-length: 3
  max-name-length: 12
  max-members: 10
  points-per-kill: 1
  invite-timeout-seconds: 60

# ------------------------------------------------------------
# Battle Pass: Free- und Premium-Pfad mit Season-Unterstuetzung.
# Belohnungen koennen pro Level unter levels.<n>.free/premium gesetzt werden;
# nicht konfigurierte Level nutzen die fallback-Formel.
# ------------------------------------------------------------
battlepass:
  season: 1
  xp-per-level: 1000
  max-level: 30
  premium-cost-money: 50000.0
  premium-cost-shards: 0
  xp-per-block-mined: 1
  xp-per-mob-kill: 2
  xp-per-player-kill: 25
  fallback:
    free-money-per-level: 250.0
    free-shard-milestone: 10
    premium-money-per-level: 600.0
    premium-shards-per-level: 5
  levels:
    5:
      free:
        money: 2000.0
        shards: 15
      premium:
        money: 5000.0
        shards: 30
    10:
      free:
        money: 5000.0
        shards: 30
      premium:
        money: 12000.0
        shards: 60
    30:
      free:
        money: 20000.0
        shards: 100
      premium:
        money: 50000.0
        shards: 300

# ------------------------------------------------------------
# Quests: taegliche & woechentliche Missionen.
#   objective: BREAK | PLACE | KILL_ENTITY | KILL_PLAYER | FISH
#   filter:    Material-/EntityType-Name (leer = beliebig)
# daily-count / weekly-count = wie viele aus dem Pool taeglich/woechentlich
# aktiv sind (rotieren automatisch, Reset taeglich/woechentlich).
# ------------------------------------------------------------
quests:
  daily-count: 3
  weekly-count: 2
  daily:
    mine_stone:
      display: "Baue 200 Stein ab"
      icon: STONE
      objective: BREAK
      filter: STONE
      amount: 200
      reward-money: 500.0
      reward-shards: 3
      reward-xp: 50
    mine_iron:
      display: "Baue 32 Eisenerz ab"
      icon: RAW_IRON
      objective: BREAK
      filter: IRON_ORE
      amount: 32
      reward-money: 800.0
      reward-shards: 5
      reward-xp: 70
    kill_zombies:
      display: "Töte 30 Zombies"
      icon: ROTTEN_FLESH
      objective: KILL_ENTITY
      filter: ZOMBIE
      amount: 30
      reward-money: 600.0
      reward-shards: 4
      reward-xp: 60
    catch_fish:
      display: "Angle 15 Fische"
      icon: COD
      objective: FISH
      filter: ""
      amount: 15
      reward-money: 400.0
      reward-shards: 3
      reward-xp: 40
    pvp_kills:
      display: "Besiege 3 Spieler"
      icon: DIAMOND_SWORD
      objective: KILL_PLAYER
      filter: ""
      amount: 3
      reward-money: 1500.0
      reward-shards: 10
      reward-xp: 120
  weekly:
    mine_diamonds:
      display: "Baue 24 Diamanterz ab"
      icon: DIAMOND
      objective: BREAK
      filter: DIAMOND_ORE
      amount: 24
      reward-money: 5000.0
      reward-shards: 40
      reward-xp: 400
    weekly_pvp:
      display: "Besiege 25 Spieler"
      icon: NETHERITE_SWORD
      objective: KILL_PLAYER
      filter: ""
      amount: 25
      reward-money: 10000.0
      reward-shards: 80
      reward-xp: 700
    big_mining:
      display: "Baue 3000 Stein ab"
      icon: STONE_BRICKS
      objective: BREAK
      filter: STONE
      amount: 3000
      reward-money: 4000.0
      reward-shards: 30
      reward-xp: 350

# Server-Spawn + Schutzzone. Spawn bequem per /setspawn setzen.
spawn:
  # Radius der Schutzzone um den Spawn (Bloecke, 0 = Schutz aus).
  # In der Zone: kein Blockabbau/Platzieren (ausser bigmc.spawn.bypass), kein PvP.
  protection-radius: 32
  location:
    world: ""
    x: 0.0
    y: 100.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0

# Random-Teleport (/rtp): zufaellige sichere Position in dieser Area.
rtp:
  # Zielwelt (Name aus dem Server-Ordner, meist "world")
  world: "world"
  # Zentrum der RTP-Area
  center-x: 0
  center-z: 0
  # Spieler landen zwischen min- und max-radius vom Zentrum entfernt
  min-radius: 500
  max-radius: 5000
  # Cooldown zwischen zwei RTPs (Sekunden)
  cooldown-seconds: 60
  # Kosten pro RTP (0 = kostenlos)
  cost: 0.0
  # Wie viele Zufallspositionen maximal geprueft werden
  max-attempts: 25

# Teleport-Anfragen (/tpa)
tpa:
  # Sekunden, bis eine Anfrage verfaellt
  timeout-seconds: 60

# Sidebar-Scoreboard (Design/Zeilen stehen in der messages.yml)
scoreboard:
  # Sidebar fuer neue Spieler automatisch anzeigen?
  enabled-by-default: true
  # Aktualisierung in Sekunden
  update-seconds: 2

# Drill-Spitzhacke: baut einen 3x3-Bereich ab (Ebene je nach Blickrichtung).
drill:
  # Material der Spitzhacke
  material: DIAMOND_PICKAXE
  # Kaufpreis per /drill
  price: 50000.0
  # Zusaetzlicher Verschleiss je mit-gebrochenem Block (0 = kein Extra-Verschleiss)
  durability-per-block: 1

# Event-Einstellungen: Belohnung fuer alle Teilnehmer beim /event stop.
event:
  reward:
    money: 2500.0
    items:
      DIAMOND: 3
      GOLDEN_APPLE: 2

# Vote-Belohnungen (ueber NuVotifier). %player% wird in Befehlen ersetzt.
vote:
  # Sieg/Vote im Chat fuer alle ankuendigen?
  broadcast: true
  # Geld pro Vote
  money: 500.0
  # Item-Belohnungen pro Vote (Material: Anzahl)
  items:
    DIAMOND: 1
    EXPERIENCE_BOTTLE: 8
  # Konsolen-Befehle pro Vote (z.B. Crate-Key). Leer lassen, wenn nicht gewuenscht.
  commands: []
  # Vote-Links, die /vote anzeigt
  links:
    - "&7Vote für uns und erhalte Belohnungen:"
    - "&b» &fhttps://example.com/vote1"
    - "&b» &fhttps://example.com/vote2"

# Flug-Einstellungen (kostenpflichtiges, befristetes Fliegen)
fly:
  # Preis pro Kauf
  price: 1000.0
  # Flugdauer pro Kauf (in Sekunden)
  duration-seconds: 300
  # Wie viele Sekunden vor Ablauf gewarnt wird
  warn-seconds: 10
  # Sturzschutz nach Flug-Ende (in Server-Ticks, 20 Ticks = 1 Sekunde)
  fall-protection-ticks: 100

# ------------------------------------------------------------
# Rangsystem (Leiter): Spieler steigen mit /rank buy auf.
# Reihenfolge in dieser Datei = Reihenfolge der Leiter (oben = niedrigster).
#   name                     -> Anzeigename (mit Farbcodes)
#   prefix                   -> Chat-Prefix
#   cost                     -> Preis fuer DIESEN Rang (erster Rang meist 0)
#   required-playtime-hours  -> benoetigte Spielzeit (optional)
#   required-kills           -> benoetigte Kills (optional)
#   permissions              -> kumulativ (hoehere Raenge erben niedrigere)
# ------------------------------------------------------------
ranks:
  # Aufstieg fuer alle im Chat ankuendigen?
  broadcast-rankup: true
  list:
    spieler:
      name: "&7Spieler"
      prefix: "&7[Spieler] "
      cost: 0
      required-playtime-hours: 0
      required-kills: 0
      permissions: []
    bronze:
      name: "&6Bronze"
      prefix: "&6[Bronze] "
      cost: 5000
      required-playtime-hours: 2
      required-kills: 0
      permissions:
        - "bigmc.perk.bronze"
    silber:
      name: "&7&lSilber"
      prefix: "&7&l[Silber] "
      cost: 25000
      required-playtime-hours: 10
      required-kills: 25
      permissions:
        - "bigmc.perk.silber"
    gold:
      name: "&e&lGold"
      prefix: "&e&l[Gold] "
      cost: 100000
      required-playtime-hours: 30
      required-kills: 100
      permissions:
        - "bigmc.perk.gold"
    diamant:
      name: "&b&lDiamant"
      prefix: "&b&l[Diamant] "
      cost: 500000
      required-playtime-hours: 75
      required-kills: 300
      permissions:
        - "bigmc.perk.diamant"

# Duell-Einstellungen
duel:
  # Sekunden, die eine Herausforderung gueltig bleibt
  challenge-timeout-seconds: 30
  # Countdown vor Duell-Start (Spieler sind solange eingefroren)
  countdown-seconds: 5
  # Sieger im Chat fuer alle bekanntgeben?
  broadcast-winner: true
  # Arena-Spawnpunkte - bequem per "/duel setspawn 1" und "/duel setspawn 2" setzen.
  # (Hier nur als Platzhalter; world leer = Arena nicht gesetzt.)
  arena:
    spawn1:
      world: ""
      x: 0.0
      y: 100.0
      z: 0.0
      yaw: 0.0
      pitch: 0.0
    spawn2:
      world: ""
      x: 10.0
      y: 100.0
      z: 0.0
      yaw: 0.0
      pitch: 0.0
  # Start-Kit fuer beide Spieler (gleich = fair). enabled: false -> ohne Kit.
  kit:
    enabled: true
    armor:
      helmet: IRON_HELMET
      chestplate: IRON_CHESTPLATE
      leggings: IRON_LEGGINGS
      boots: IRON_BOOTS
    items:
      DIAMOND_SWORD: 1
      BOW: 1
      ARROW: 16
      GOLDEN_APPLE: 4
      COOKED_BEEF: 16

