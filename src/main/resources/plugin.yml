name: BigMC
version: '${project.version}'
main: eu.bieder.bigmc.BigMC
api-version: '1.21'
author: Felix
description: Survival-SMP Plugin im Stil von HugoSMP und DonutSMP.

commands:
  money:
    description: Zeigt den Kontostand an oder verwaltet Guthaben (Admin).
    usage: /money [spieler] | /money give|take|set <spieler> <betrag>
    aliases: [balance, bal, geld]
    permission: bigmc.money
  pay:
    description: Ueberweist Geld an einen anderen Spieler.
    usage: /pay <spieler> <betrag>
    permission: bigmc.pay
  baltop:
    description: Zeigt die reichsten Spieler des Servers.
    usage: /baltop
    aliases: [balancetop, moneytop]
    permission: bigmc.baltop
  shop:
    description: Oeffnet den Adminshop.
    usage: /shop
    permission: bigmc.shop
  sell:
    description: Verkauft Items aus der Hand oder dem ganzen Inventar.
    usage: /sell hand|all
    permission: bigmc.sell
  ah:
    description: Oeffnet das Auktionshaus oder stellt Items ein.
    usage: /ah | /ah sell <preis> | /ah collect
    aliases: [auktionshaus, auctionhouse]
    permission: bigmc.ah

permissions:
  bigmc.money:
    description: Eigenen Kontostand anzeigen.
    default: true
  bigmc.money.others:
    description: Kontostand anderer Spieler anzeigen.
    default: true
  bigmc.money.admin:
    description: Geld geben, abziehen und setzen.
    default: op
  bigmc.pay:
    description: Geld an andere Spieler ueberweisen.
    default: true
  bigmc.baltop:
    description: Rangliste der reichsten Spieler anzeigen.
    default: true
  bigmc.shop:
    description: Den Adminshop oeffnen.
    default: true
  bigmc.sell:
    description: Items per /sell verkaufen.
    default: true
  bigmc.ah:
    description: Das Auktionshaus benutzen.
    default: true
