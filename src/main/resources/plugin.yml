name: BigMC
version: '${project.version}'
main: eu.bieder.bigmc.BigMC
api-version: '1.21'
author: Felix
description: Survival-SMP Plugin im Stil von HugoSMP und DonutSMP.
# NuVotifier ist optional - das Plugin laeuft auch ohne (Soft-Depend).
softdepend: [Votifier, NuVotifier]

# SQLite-Treiber zur Laufzeit von Paper laden lassen (von Maven Central).
# So wird die native Bibliothek NICHT vom Plugin-Remapper angefasst -> kein
# UnsatisfiedLinkError. Benoetigt beim ersten Start einmalig Internet.
libraries:
  - org.xerial:sqlite-jdbc:3.47.1.0

commands:
  bigmc:
    description: BigMC-Hauptbefehl (Info & Reload).
    usage: /bigmc | /bigmc reload
    permission: bigmc.use
  money:
    description: Zeigt den Kontostand an oder verwaltet Guthaben (Admin).
    usage: /money [spieler] | /money give|take|set <spieler> <betrag>
    aliases: [balance, bal, geld]
    permission: bigmc.money
  pay:
    description: Ueberweist Geld an einen anderen Spieler.
    usage: /pay <spieler> <betrag>
    permission: bigmc.pay
  baltop:
    description: Zeigt die reichsten Spieler des Servers.
    usage: /baltop
    aliases: [balancetop, moneytop]
    permission: bigmc.baltop
  shop:
    description: Oeffnet den Adminshop.
    usage: /shop
    permission: bigmc.shop
  sell:
    description: Verkauft Items aus der Hand oder dem ganzen Inventar.
    usage: /sell hand|all
    permission: bigmc.sell
  ah:
    description: Oeffnet das Auktionshaus oder stellt Items ein.
    usage: /ah | /ah sell <preis> | /ah collect
    aliases: [auktionshaus, auctionhouse]
    permission: bigmc.ah
  order:
    description: Auftragssystem - Items bestellen und liefern.
    usage: /order create|list|fulfill|collect|cancel
    aliases: [auftrag, orders]
    permission: bigmc.order
  stats:
    description: Zeigt die Statistiken eines Spielers.
    usage: /stats [spieler]
    aliases: [statistik]
    permission: bigmc.stats
  top:
    description: Zeigt Ranglisten verschiedener Kategorien.
    usage: /top <kills|tode|duelle|spielzeit|geld>
    permission: bigmc.top
  duel:
    description: Fordere einen Spieler zum 1vs1 heraus.
    usage: /duel <spieler> | /duel accept | /duel deny
    aliases: [duell, 1v1]
    permission: bigmc.duel
  rank:
    description: Zeigt deinen Rang und kauft den naechsten.
    usage: /rank | /rank buy | /rank set <spieler> <rang>
    aliases: [rang]
    permission: bigmc.rank
  ranks:
    description: Listet alle verfuegbaren Raenge auf.
    usage: /ranks
    aliases: [raenge]
    permission: bigmc.ranks
  fly:
    description: Kauft befristete Flugzeit gegen Ingame-Geld.
    usage: /fly | /fly off | /fly time
    aliases: [fliegen]
    permission: bigmc.fly
  vote:
    description: Zeigt Vote-Links und holt Belohnungen ab.
    usage: /vote | /vote claim | /vote test [name]
    aliases: [voten]
    permission: bigmc.vote
  event:
    description: Server-Events starten, beitreten und beenden.
    usage: /event start <name> | stop | join | leave | info
    aliases: [events]
    permission: bigmc.event
  spawnershop:
    description: Oeffnet den Spawner-Shop.
    usage: /spawnershop
    aliases: [spawnshop, sshop, spawner]
    permission: bigmc.spawnershop
  drill:
    description: Kauft eine Drill-Spitzhacke (3x3-Abbau).
    usage: /drill | /drill give <spieler>
    permission: bigmc.drill
  board:
    description: Blendet die Info-Sidebar ein oder aus.
    usage: /board
    aliases: [sidebar, sb]
    permission: bigmc.board
  shards:
    description: Zeigt und verwaltet Shards (zweite Waehrung).
    usage: /shards [spieler] | /shards pay <spieler> <anzahl>
    permission: bigmc.shards
  afk:
    description: Teleportiert in die AFK-Zone (dort verdienst du Shards).
    usage: /afk | /afk set
    permission: bigmc.afk
  spawn:
    description: Teleportiert zum Server-Spawn.
    usage: /spawn
    permission: bigmc.spawn
  setspawn:
    description: Setzt den Server-Spawn (Admin).
    usage: /setspawn
    permission: bigmc.spawn.admin
  spawnbuild:
    description: Baut automatisch eine Spawn-Area (Admin).
    usage: /spawnbuild confirm
    permission: bigmc.spawn.admin
  rtp:
    description: Zufaelliger Teleport in die Wildnis (Overworld/Nether/End).
    usage: /rtp [overworld|nether|end]
    aliases: [wild, randomtp]
    permission: bigmc.rtp
  tpa:
    description: Sendet eine Teleport-Anfrage an einen Spieler.
    usage: /tpa <spieler>
    permission: bigmc.tpa
  tpaccept:
    description: Nimmt die offene Teleport-Anfrage an.
    usage: /tpaccept
    aliases: [tpyes]
    permission: bigmc.tpa
  tpadeny:
    description: Lehnt die offene Teleport-Anfrage ab.
    usage: /tpadeny
    aliases: [tpno]
    permission: bigmc.tpa
  quests:
    description: Oeffnet das Daily- und Weekly-Quest-Menue.
    usage: /quests
    aliases: [quest, q]
    permission: bigmc.quests
  battlepass:
    description: Oeffnet den Battle Pass.
    usage: /battlepass [buy]
    aliases: [bp, pass]
    permission: bigmc.battlepass
  clan:
    description: Clan-System (erstellen, beitreten, verwalten).
    usage: /clan create|invite|accept|leave|info|top|chat ...
    aliases: [clans, gilde]
    permission: bigmc.clan
  c:
    description: Sendet eine Nachricht in den Clan-Chat.
    usage: /c <nachricht>
    aliases: [cc]
    permission: bigmc.clan
  crate:
    description: Crates oeffnen, Vorschau anzeigen, Schluessel vergeben.
    usage: /crate [open|preview|givekey] ...
    aliases: [crates, cases]
    permission: bigmc.crate
  bossevent:
    description: Boss-Events starten, stoppen und auflisten.
    usage: /bossevent start|stop|list
    aliases: [boss, bossevents]
    permission: bigmc.boss
  prestige:
    description: Oeffnet das Prestige-Menue.
    usage: /prestige [confirm]
    aliases: [prestiges]
    permission: bigmc.prestige
  cosmetics:
    description: Oeffnet das Cosmetics-Menue.
    usage: /cosmetics
    aliases: [cosmetic, kosmetik]
    permission: bigmc.cosmetics
  dailyreward:
    description: Taegliche Login-Belohnung abholen.
    usage: /dailyreward [claim]
    aliases: [daily, dailylogin]
    permission: bigmc.dailyreward
  season:
    description: Season-Info anzeigen oder die Season beenden.
    usage: /season info|end
    aliases: [seasons]
    permission: bigmc.season
  leaderboard:
    description: Zeigt die Ranglisten (Geld, Shards, Kills, Prestige ...).
    usage: /leaderboard [kategorie]
    aliases: [lb, leaderboards, ranglisten]
    permission: bigmc.leaderboard
  bigmcadmin:
    description: Zentrales Admin-Werkzeug fuer alle Systeme.
    usage: /bigmcadmin season|battlepass|quest|crate|clan|prestige|reload ...
    aliases: [bmadmin]
    permission: bigmc.admin
  menu:
    description: Oeffnet das zentrale Hauptmenue mit allen Features.
    usage: /menu
    aliases: [bigmcmenu, hub]
    permission: bigmc.menu
  home:
    description: Oeffnet die Home-Liste oder teleportiert zu einem Home.
    usage: /home [name]
    aliases: [homes]
    permission: bigmc.home
  sethome:
    description: Setzt ein Home an deiner aktuellen Position.
    usage: /sethome <name>
    permission: bigmc.sethome
  delhome:
    description: Loescht eines deiner Homes.
    usage: /delhome <name>
    aliases: [removehome]
    permission: bigmc.home
  ec:
    description: Oeffnet die virtuelle Enderchest (Premium 54 Slots).
    usage: /ec
    aliases: [enderchest, echest]
    permission: bigmc.ec
  craft:
    description: Oeffnet eine tragbare Werkbank.
    usage: /craft
    aliases: [workbench, wb]
    permission: bigmc.craft
  trash:
    description: Oeffnet einen Muelleimer (Inhalt wird verworfen).
    usage: /trash
    aliases: [muell, dispose]
    permission: bigmc.trash
  rename:
    description: Benennt das Item in der Hand um (Premium).
    usage: /rename <name>
    permission: bigmc.rename
  tpauto:
    description: Schaltet automatisches Annehmen von TPA-Anfragen um.
    usage: /tpauto
    permission: bigmc.tpa

permissions:
  bigmc.use:
    description: BigMC-Info anzeigen.
    default: true
  bigmc.admin:
    description: BigMC neu laden.
    default: op
  bigmc.money:
    description: Eigenen Kontostand anzeigen.
    default: true
  bigmc.money.others:
    description: Kontostand anderer Spieler anzeigen.
    default: true
  bigmc.money.admin:
    description: Geld geben, abziehen und setzen.
    default: op
  bigmc.pay:
    description: Geld an andere Spieler ueberweisen.
    default: true
