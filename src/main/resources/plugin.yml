name: BigMC
version: '${project.version}'
main: eu.bieder.bigmc.BigMC
api-version: '1.21'
author: Felix
description: Survival-SMP Plugin im Stil von HugoSMP und DonutSMP.
# NuVotifier ist optional - das Plugin laeuft auch ohne (Soft-Depend).
softdepend: [Votifier, NuVotifier]

commands:
  bigmc:
    description: BigMC-Hauptbefehl (Info & Reload).
    usage: /bigmc | /bigmc reload
    permission: bigmc.use
  money:
    description: Zeigt den Kontostand an oder verwaltet Guthaben (Admin).
    usage: /money [spieler] | /money give|take|set <spieler> <betrag>
    aliases: [balance, bal, geld]
    permission: bigmc.money
  pay:
    description: Ueberweist Geld an einen anderen Spieler.
    usage: /pay <spieler> <betrag>
    permission: bigmc.pay
  baltop:
    description: Zeigt die reichsten Spieler des Servers.
    usage: /baltop
    aliases: [balancetop, moneytop]
    permission: bigmc.baltop
  shop:
    description: Oeffnet den Adminshop.
    usage: /shop
    permission: bigmc.shop
  sell:
    description: Verkauft Items aus der Hand oder dem ganzen Inventar.
    usage: /sell hand|all
    permission: bigmc.sell
  ah:
    description: Oeffnet das Auktionshaus oder stellt Items ein.
    usage: /ah | /ah sell <preis> | /ah collect
    aliases: [auktionshaus, auctionhouse]
    permission: bigmc.ah
  order:
    description: Auftragssystem - Items bestellen und liefern.
    usage: /order create|list|fulfill|collect|cancel
    aliases: [auftrag, orders]
    permission: bigmc.order
  stats:
    description: Zeigt die Statistiken eines Spielers.
    usage: /stats [spieler]
    aliases: [statistik]
    permission: bigmc.stats
  top:
    description: Zeigt Ranglisten verschiedener Kategorien.
    usage: /top <kills|tode|duelle|spielzeit|geld>
    permission: bigmc.top
  duel:
    description: Fordere einen Spieler zum 1vs1 heraus.
    usage: /duel <spieler> | /duel accept | /duel deny
    aliases: [duell, 1v1]
    permission: bigmc.duel
  rank:
    description: Zeigt deinen Rang und kauft den naechsten.
    usage: /rank | /rank buy | /rank set <spieler> <rang>
    aliases: [rang]
    permission: bigmc.rank
  ranks:
    description: Listet alle verfuegbaren Raenge auf.
    usage: /ranks
    aliases: [raenge]
    permission: bigmc.ranks
  fly:
    description: Kauft befristete Flugzeit gegen Ingame-Geld.
    usage: /fly | /fly off | /fly time
    aliases: [fliegen]
    permission: bigmc.fly
  vote:
    description: Zeigt Vote-Links und holt Belohnungen ab.
    usage: /vote | /vote claim | /vote test [name]
    aliases: [voten]
    permission: bigmc.vote
  event:
    description: Server-Events starten, beitreten und beenden.
    usage: /event start <name> | stop | join | leave | info
    aliases: [events]
    permission: bigmc.event
  spawnershop:
    description: Oeffnet den Spawner-Shop.
    usage: /spawnershop
    aliases: [spawnshop, sshop, spawner]
    permission: bigmc.spawnershop
  drill:
    description: Kauft eine Drill-Spitzhacke (3x3-Abbau).
    usage: /drill | /drill give <spieler>
    permission: bigmc.drill
  board:
    description: Blendet die Info-Sidebar ein oder aus.
    usage: /board
    aliases: [sidebar, sb]
    permission: bigmc.board

permissions:
  bigmc.use:
    description: BigMC-Info anzeigen.
    default: true
  bigmc.admin:
    description: BigMC neu laden.
    default: op
  bigmc.money:
    description: Eigenen Kontostand anzeigen.
    default: true
  bigmc.money.others:
    description: Kontostand anderer Spieler anzeigen.
    default: true
  bigmc.money.admin:
    description: Geld geben, abziehen und setzen.
    default: op
  bigmc.pay:
    description: Geld an andere Spieler ueberweisen.
    default: true
  bigmc.baltop:
    description: Rangliste der reichsten Spieler anzeigen.
    default: true
  bigmc.shop:
    description: Den Adminshop oeffnen.
    default: true
  bigmc.sell:
    description: Items per /sell verkaufen.
    default: true
  bigmc.ah:
    description: Das Auktionshaus benutzen.
    default: true
  bigmc.order:
    description: Das Auftragssystem benutzen.
    default: true
  bigmc.stats:
    description: Statistiken anzeigen.
    default: true
  bigmc.top:
    description: Ranglisten anzeigen.
    default: true
  bigmc.duel:
    description: Duelle starten und annehmen.
    default: true
  bigmc.duel.admin:
    description: Arena-Spawns fuer Duelle setzen.
    default: op
  bigmc.rank:
    description: Eigenen Rang anzeigen und kaufen.
    default: true
  bigmc.ranks:
    description: Alle Raenge auflisten.
    default: true
  bigmc.fly:
    description: Befristetes Fliegen kaufen.
    default: true
  bigmc.vote:
    description: Vote-Links und Belohnungen.
    default: true
  bigmc.vote.admin:
    description: Votes zum Testen ausloesen.
    default: op
  bigmc.event:
    description: Events beitreten und Infos sehen.
    default: true
  bigmc.event.admin:
    description: Events starten und beenden.
    default: op
  bigmc.spawnershop:
    description: Den Spawner-Shop oeffnen.
    default: true
  bigmc.spawner.admin:
    description: Fremde Custom-Spawner abbauen/abholen.
    default: op
  bigmc.drill:
    description: Drill-Spitzhacke kaufen und nutzen.
    default: true
  bigmc.drill.admin:
    description: Drill-Spitzhacke verschenken.
    default: op
  bigmc.board:
    description: Info-Sidebar ein-/ausblenden.
    default: true
  bigmc.rank.admin:
    description: Raenge anderer Spieler setzen.
    default: op
